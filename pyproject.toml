[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subroformer"
version = "0.1.0"
description = "SBRoformer training with ZFTurbo data augmentation and DDP random mixing"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.11.0",
  "audiomentations>=0.42.0",
  "einops>=0.8.1",
  "huggingface-hub>=1.0",
  "librosa>=0.11.0",
  "ml-collections>=1.1.0",
  "museval>=0.4.1",
  "numpy>=2.0",
  "omegaconf>=2.3.0",
  "pedalboard>=0.9.19",
  "pyyaml>=6.0.2",
  "safetensors>=0.4.5",
  "scipy>=1.14.0",
  "soundfile>=0.13.1",
  "torch>=2.5",
  "tqdm>=4.67.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools]
py-modules = [
  "checkpoint_utils",
  "dataset",
  "evaluate",
  "inference",
  "model",
  "model_utils",
  "train",
  "training_utils",
]

[tool.setuptools.packages.find]
include = ["dsp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
